version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-system-app
    env_file: .env
    ports:
      - "${APPLICATION_PORT:-8080}:${APPLICATION_PORT:-8080}"
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APPLICATION_PORT:-8080}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Shared network with external PostgreSQL container
networks:
  auth-network:
    external: true
    name: postgres-docker_postgres-16-net
