version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-system-app
    ports:
      - "8080:8080"
    environment:
      # Application
      APPLICATION_NAME: ${APPLICATION_NAME:-auth-system}
      APPLICATION_ENV: ${APPLICATION_ENV:-development}
      APPLICATION_PORT: ${APPLICATION_PORT:-8080}
      
      # Database - Connect to external container
      DB_CONFIGS_HOST: ${DB_CONFIGS_HOST:-db_postgres}
      DB_CONFIGS_PORT: ${DB_CONFIGS_PORT:-5432}
      DB_CONFIGS_USER: ${DB_CONFIGS_USER:-postgres}
      DB_CONFIGS_PASSWORD: ${DB_CONFIGS_PASSWORD}
      DB_CONFIGS_NAME: ${DB_CONFIGS_NAME:-authentication_db}
      DB_CONFIGS_SSLMODE: ${DB_CONFIGS_SSLMODE:-disable}
      DB_CONFIGS_MAXIDLECONN: ${DB_CONFIGS_MAXIDLECONN:-10}
      DB_CONFIGS_MAXOPENCONN: ${DB_CONFIGS_MAXOPENCONN:-100}
      
      # JWT
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ACCESS_TOKEN_EXPIRE: ${AUTH_JWT_ACCESS_TOKEN_EXPIRE:-15m}
      AUTH_JWT_REFRESH_TOKEN_EXPIRE: ${AUTH_JWT_REFRESH_TOKEN_EXPIRE:-7d}
      
      # OTP
      AUTH_OTP_EXPIRE: ${AUTH_OTP_EXPIRE:-5m}
      AUTH_OTP_LENGTH: ${AUTH_OTP_LENGTH:-6}
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Network yang sama dengan container database eksternal
networks:
  auth-network:
    external: true
    name: postgres-docker_postgres-16-net
